[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-benchmarking"
version = "2.0.0"
description = "Local OCR extraction and multilingual benchmarking with normalized provenance"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
optional-dependencies.models = {file = ["requirements-models.txt"]}
optional-dependencies.benchmark = {file = ["requirements-benchmark.txt"]}

[tool.setuptools.packages.find]
include = ["OCR*", "frontend*", "benchmarks*"]
exclude = ["benchmarks.legacy*", "tests*"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["benchmarks/legacy", "experiments", "runtime", "models", "OCR/.venv"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
