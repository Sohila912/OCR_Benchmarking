name: Tests

on:
  push:
  pull_request:

jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check OCR frontend benchmarks/evaluation benchmarks/run.py scripts tests
      - run: python -c "from OCR.app import create_app; from OCR.service import PROVIDER_TYPES; import frontend.app; assert set(PROVIDER_TYPES) == {'tesseract', 'docling', 'paddle_vl', 'qwen_ollama'}; create_app()"
      - run: python -B -m pytest tests -q -p no:cacheprovider
